name: Publish the book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'report/data.py'
      - 'report/charts.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build_book.py, content.py, shell.py, figs.py and the two report modules it
      # reuses are pure standard library — the figures are computed SVG, so there
      # is nothing to install.
      - name: Build the book
        run: python3 book/build_book.py

      # Every page must be a complete, self-contained, balanced document with no
      # external requests and no dead internal links.
      - name: Verify every page
        run: python3 book/check.py site

      # enablement: true turns Pages on (source = GitHub Actions) if it is not already,
      # so the repo needs no manual setup in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
